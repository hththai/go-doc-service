version: '3.9'

services:
  traefik:
    image: traefik:v3.5
    container_name: traefik
    restart: unless-stopped
    networks:
      - backend
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.web.http.redirections.entryPoint.to=web"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.websecure.http.tls=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.hthai.cloud`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      # - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./dynamic:/etc/traefik/dynamic"
      - "./certs:/certs:ro"

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ***
      MYSQL_DATABASE: goDocument
      MYSQL_USER: ***
      MYSQL_PASSWORD: ***
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-service:
    image: redis:latest
    restart: always
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  api:
    build: .
    container_name: golang_api
    user: "1000:1000"
    ports:
      - "8088:8088"
    volumes:
      - mydata:/app
    environment:
      - GO_ENV=production
      - DB_USER=***
      - DB_PASSWORD=***
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=goDocument
      - REDIS_HOST=redis-service
      - REDIS_PORT=6379
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis-service:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`box.hthai.cloud`) && PathPrefix(`/go`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.middlewares.api-strip-prefix.stripprefix.prefixes=/go"
      - "traefik.http.routers.api.middlewares=api-strip-prefix"
      - "traefik.http.services.api.loadbalancer.server.port=8088"
      - "traefik.http.routers.api.tls=true"

  client:
    build: ../client-vite/client-vite
    container_name: client_app
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client.rule=Host(`box.hthai.cloud`) && PathPrefix(`/`)"
      - "traefik.http.routers.client.entrypoints=web"
      - "traefik.http.routers.client.entrypoints=websecure"
      - "traefik.http.services.client.loadbalancer.server.port=80"
      - "traefik.http.routers.client.tls=true"
volumes:
  mydata:
  dbdata:

networks:
  backend:
    driver: bridge
