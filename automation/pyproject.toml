[project]
name = "dev-crew"
version = "0.1.0"
description = "crewAI flow that plans, implements, verifies and reviews changes to the Purchase Record app"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic]>=1.15,<2",
    "python-dotenv>=1.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Arize Phoenix tracing: uv sync --extra tracing, then TRACING=phoenix in .env
tracing = [
    "arize-phoenix-otel>=0.17",
    "openinference-instrumentation-crewai>=1.1",
    "openinference-instrumentation-anthropic>=3.3",
    "openinference-instrumentation-openai>=0.1.69",
    "openinference-instrumentation-litellm>=0.1.52",
]

[project.scripts]
dev-crew = "dev_crew.main:cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
