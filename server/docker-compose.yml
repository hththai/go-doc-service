version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: goDocument
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: . # Current directory (where Dockerfile & main.go are)
    container_name: golang_api
    user: "1000:1000"
    ports:
      - "8088:8088"
    volumes:
      - mydata:/app
    environment:
      - GO_ENV=production
      - DB_USER=appuser
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=33067
      - DB_NAME=goDocument
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

volumes:
  mydata:
  dbdata:


networks:
  backend:
    driver: bridge
