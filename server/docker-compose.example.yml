version: '3.9'

services:
  traefik:
    image: traefik:v3.5
    container_name: traefik
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard (insecure mode)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./dynamic:/etc/traefik/dynamic"
      - "./certs:/certs:ro"

  whoami:
    image: "traefik/whoami"
    restart: unless-stopped
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.docker.localhost`)"
      - "traefik.http.routers.whoami.entrypoints=web"

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-service:
    image: redis:latest
    restart: always
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  api:
    build: .
    container_name: golang_api
    ports:
      - "${API_PORT:-8088}:8088"
    volumes:
      - filedata:/app/filedata
      - logdata:/app/app/log
    environment:
      - GO_ENV=${GO_ENV:-production}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - REDIS_ADDR=redis-service:6379
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis-service:
        condition: service_healthy
  # Routing configured via dynamic/config.yml instead of labels
  # client:
  #   build: ../client-vite/client-vite # path to your client folder
  #   container_name: client_app
  #   restart: unless-stopped
  #   networks:
  #     - backend
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.client.rule=Host(`client.golang.localdomain`)"
  #     - "traefik.http.routers.client.entrypoints=websecure"
  #     - "traefik.http.routers.client.tls=true"
  #     - "traefik.http.services.client.loadbalancer.server.port=80"

volumes:
  filedata:
  logdata:
  dbdata:


networks:
  backend:
    driver: bridge
