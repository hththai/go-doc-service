log:
  level: DEBUG
  format: common

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    watch: true

  file:
    directory: /etc/traefik/dynamic
    watch: true

tls:
  certificates:
    - certFile: /certs/cert.pem
      keyFile: /certs/key.pem